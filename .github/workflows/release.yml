name: Release image

# Publishes the container image to GitHub Packages on a version tag:
#   git tag -a v1.0.0 -m "release 1.0.0" && git push origin v1.0.0
# publishes ghcr.io/<owner>/safe-prox-mcp:1.0.0, :1.0 and :latest.
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/SafeProxMcp/SafeProxMcp.csproj -c Release

      - name: Test
        run: dotnet test tests/SafeProxMcp.Tests/SafeProxMcp.Tests.csproj -c Release

  image:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Tag must be semver with a leading v: v1.2.3 -> 1.2.3, 1.2, latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=safe-prox-mcp
            org.opencontainers.image.description=Non-destructive MCP server for Proxmox VE clusters
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Plain single-arch image: attestations make some pull tools report an
          # unknown platform, and nothing here needs them.
          provenance: false
          sbom: false
